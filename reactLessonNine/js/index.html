<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>event hander</title>
</head>

<body>
    <!-- Step 1 -> Create button in html -->
    <button id="btn">Click Me</button>
    <script>
        // Step 2 ->select the button from the HTML Decument =the whole page
        const btn = document.getElementById("btn")
        // Step -3 ->Create the Function thta will Run When the button is clicked
        function handleClick() {
            // step 4 -Show a pop up message in the browser
            alert("Button Clicked ")
        }
        // step 5 -> Add an event listener to the button
        // "click" -> The event we are listening for 
        // handleClick -> The function that wil run when the vent happens 
        btn.addEventListener("click", handleClick)

    </script>
</body>

</html>
